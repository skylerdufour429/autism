<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="iOS App Collection Archive metadata catalog" />
    <title>iOS App Collection Archive</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-wrap">
        <img src="assets/logo.svg" alt="App Collection logo" class="brand-logo" />
        <div>
          <p class="eyebrow">Archive</p>
          <h1>iOS App Collection</h1>
        </div>
      </div>
    </header>

    <main class="page-shell">
      <section class="toolbar" aria-label="App filters">
        <label class="search-field" for="searchInput">
          <span>Search</span>
          <input
            id="searchInput"
            type="search"
            placeholder="Search by app name or bundle ID"
            autocomplete="off"
          />
        </label>
        <div id="resultsCount" class="results-count" aria-live="polite"></div>
      </section>

      <section id="appGrid" class="app-grid" aria-live="polite"></section>
    </main>

    <footer class="footer">
      <p>© <span id="year"></span> iOS App Collection Archive</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
